<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Research archive{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">Research archive</a>
    <form class="search" action="{{ url_for('search') }}" method="get" role="search">
      <input type="search" name="q" placeholder="Search titles, authors, terms..."
             value="{{ q|default('') }}" aria-label="Search">
      <button type="submit">Search</button>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">treasury-news &middot; internal use only</footer>
</body>
</html>
