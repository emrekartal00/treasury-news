# Copy to secret.yaml, fill REAL values, then: oc apply -f secret.yaml
# secret.yaml is gitignored - never commit real credentials.
# Use a SELECT-only DB user for the web app (least privilege).
apiVersion: v1
kind: Secret
metadata:
  name: treasury-news-db
type: Opaque
stringData:
  DB_USER: "webapp_readonly_user"
  DB_PASSWORD: "CHANGE_ME"
  DB_CONNECT_STRING: "host:port/service_name"
  DB_SCHEMA: "YOUR_SCHEMA"
